<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" role="img" aria-label="Caiman Belly Western Boot Detail">
  <defs>
    <radialGradient id="cardGrad2" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#241c16" />
      <stop offset="70%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0a0807" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#cardGrad2)" />
  <ellipse cx="250" cy="430" rx="170" ry="18" fill="#000000" opacity="0.85" />
  <!-- Dramatic 3/4 Front Wide Square Toe Angle -->
  <g transform="translate(100, 50)">
    <!-- Shaft from 3/4 angle -->
    <path d="M100,50 L200,40 L210,260 L90,270 Z" fill="#181411" stroke="#806247" stroke-width="1.8" />
    <path d="M120,70 Q160,150 130,240" stroke="#806247" stroke-width="1.5" fill="none" />
    <path d="M170,70 Q150,150 170,240" stroke="#C7A477" stroke-width="1" fill="none" />
    <!-- Wide Square Toe Vamp -->
    <path d="M90,270 L210,260 C260,285 290,320 280,360 L180,380 L60,360 L60,320 Z" fill="#2d1d13" stroke="#806247" stroke-width="1.5" />
    <!-- High gloss caiman scales detail -->
    <rect x="130" y="290" width="30" height="24" rx="4" fill="#382519" stroke="#1d130d" />
    <rect x="170" y="285" width="32" height="24" rx="4" fill="#352317" stroke="#1d130d" />
    <rect x="120" y="320" width="34" height="26" rx="5" fill="#3a271c" stroke="#1d130d" />
    <rect x="165" y="315" width="38" height="26" rx="5" fill="#3c281e" stroke="#1d130d" />
    <rect x="210" y="310" width="30" height="26" rx="5" fill="#342217" stroke="#1d130d" />
    <!-- Double stitch welt across wide square toe -->
    <path d="M55,360 L185,382 L285,362 L280,380 L185,400 L50,378 Z" fill="#362417" stroke="#C7A477" stroke-width="1" />
    <line x1="58" y1="368" x2="183" y2="388" stroke="#F1EDE6" stroke-width="1.2" stroke-dasharray="2 2" />
    <line x1="183" y1="388" x2="280" y2="370" stroke="#F1EDE6" stroke-width="1.2" stroke-dasharray="2 2" />
  </g>
</svg>
