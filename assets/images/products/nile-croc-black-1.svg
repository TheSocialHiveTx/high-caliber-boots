<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none" role="img" aria-label="Nile Crocodile Roper Boot Profile">
  <defs>
    <radialGradient id="nileBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#19191a" />
      <stop offset="70%" stop-color="#111112" />
      <stop offset="100%" stop-color="#080809" />
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#nileBg)" />
  <ellipse cx="250" cy="420" rx="190" ry="20" fill="#000000" opacity="0.9" />
  <g transform="translate(60, 45)">
    <!-- Low Roper Shaft in matte black leather -->
    <path d="M125,70 C145,55 235,55 255,70 L265,280 L115,290 Z" fill="#131314" stroke="#444446" stroke-width="1.5" />
    <path d="M115,85 L125,85 L125,120 L115,120 Z" fill="#222224" stroke="#806247" stroke-width="0.8" />
    <path d="M255,85 L265,85 L265,120 L255,120 Z" fill="#222224" stroke="#806247" stroke-width="0.8" />
    <line x1="190" y1="90" x2="190" y2="250" stroke="#333336" stroke-width="1" />
    <!-- Vamp (Jet Black Glazed Nile Crocodile) -->
    <path d="M115,290 L265,280 C310,305 365,335 395,370 C400,378 395,388 380,390 L85,390 L80,340 Z" fill="#0d0d0e" stroke="#3a3a3d" stroke-width="1.5" />
    <line x1="160" y1="295" x2="160" y2="385" stroke="#222225" stroke-width="2.5" />
    <line x1="210" y1="298" x2="220" y2="385" stroke="#222225" stroke-width="2.5" />
    <line x1="260" y1="310" x2="280" y2="385" stroke="#222225" stroke-width="2.5" />
    <line x1="310" y1="330" x2="335" y2="385" stroke="#222225" stroke-width="2.5" />
    <line x1="355" y1="350" x2="375" y2="385" stroke="#222225" stroke-width="2.5" />
    <!-- Roper Flat Walking Heel -->
    <path d="M85,390 L80,425 L135,425 L140,390 Z" fill="#141416" stroke="#444" stroke-width="1" />
    <rect x="80" y="415" width="55" height="10" fill="#080808" />
    <!-- Channeled Black Edge Sole -->
    <path d="M80,390 L390,388 L390,400 L80,402 Z" fill="#1e1e20" stroke="#806247" stroke-width="1" />
    <line x1="140" y1="394" x2="385" y2="392" stroke="#C7A477" stroke-width="1.2" stroke-dasharray="2 3" />
  </g>
</svg>
