<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <defs>
    <pattern id="caimanTile" width="40" height="40" patternUnits="userSpaceOnUse">
      <!-- Caiman scale tessellation -->
      <rect x="1" y="1" width="18" height="18" rx="2" fill="#141312" stroke="#1d1b19" stroke-width="1" />
      <rect x="21" y="1" width="18" height="18" rx="2" fill="#111110" stroke="#1d1b19" stroke-width="1" />
      <rect x="1" y="21" width="18" height="18" rx="2" fill="#131211" stroke="#1d1b19" stroke-width="1" />
      <rect x="21" y="21" width="18" height="18" rx="2" fill="#161513" stroke="#1d1b19" stroke-width="1" />
      <circle cx="10" cy="10" r="1.5" fill="#25211e" opacity="0.4" />
      <circle cx="30" cy="10" r="1.5" fill="#25211e" opacity="0.4" />
      <circle cx="10" cy="30" r="1.5" fill="#25211e" opacity="0.4" />
      <circle cx="30" cy="30" r="1.5" fill="#25211e" opacity="0.4" />
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#caimanTile)" />
</svg>
