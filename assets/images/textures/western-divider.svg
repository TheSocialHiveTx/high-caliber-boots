      <stop offset="0%" stop-color="#C7A477" stop-opacity="0" />
      <stop offset="100%" stop-color="#C7A477" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="divGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
