<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none" role="img" aria-label="FR Flame Resistant Clothing Collection">
  <defs>
    <radialGradient id="frBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261b17" />
      <stop offset="55%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a4533" />
      <stop offset="50%" stop-color="#3d2e22" />
      <stop offset="100%" stop-color="#241a12" />
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#frBg)" />

  <!-- Heavyweight Duck Canvas FR Work Jacket Silhouette -->
  <g transform="translate(100, 110)">
    <!-- Shadow -->
    <ellipse cx="200" cy="470" rx="200" ry="24" fill="#000000" opacity="0.85" />

    <!-- Jacket Body -->
    <path d="M80,100 L150,40 L250,40 L320,100 L370,220 L325,250 L290,190 L295,430 L105,430 L110,190 L75,250 L30,220 Z" fill="url(#canvasGrad)" stroke="#806247" stroke-width="1.8" />
    
    <!-- Corduroy collar in dark brown -->
    <polygon points="150,40 200,85 160,110 120,55" fill="#1b140e" stroke="#806247" stroke-width="1" />
    <polygon points="250,40 200,85 240,110 280,55" fill="#1b140e" stroke="#806247" stroke-width="1" />

    <!-- Heavy-duty brass zipper placket with storm flap -->
    <rect x="190" y="80" width="20" height="350" fill="#2d2016" stroke="#806247" stroke-width="1" />
    <line x1="200" y1="85" x2="200" y2="425" stroke="#C7A477" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Left Chest Zipper Pocket with NFPA 2112 patch placeholder -->
    <rect x="125" y="140" width="55" height="40" rx="2" fill="#2d2016" stroke="#806247" stroke-width="1" />
    <line x1="125" y1="140" x2="180" y2="140" stroke="#C7A477" stroke-width="2" />
    
    <!-- Flame Resistant CAT 2 Badge Shield -->
    <g transform="translate(135, 150)">
      <polygon points="10,0 20,4 20,16 10,22 0,16 0,4" fill="#A54B25" stroke="#C7A477" stroke-width="0.8" />
      <text x="10" y="14" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="900" fill="#F1EDE6">FR</text>
    </g>

    <!-- Lower Handwarmer Slash Pockets -->
    <path d="M120,270 L170,270 L155,360 L120,360 Z" fill="#241a12" stroke="#806247" stroke-width="1" />
    <path d="M280,270 L230,270 L245,360 L280,360 Z" fill="#241a12" stroke="#806247" stroke-width="1" />

    <!-- Triple-needle reinforced safety seams -->
    <line x1="105" y1="420" x2="295" y2="420" stroke="#C7A477" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="105" y1="424" x2="295" y2="424" stroke="#C7A477" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Tag -->
  <g transform="translate(40, 610)">
    <rect width="190" height="34" rx="2" fill="#181716" stroke="#A54B25" stroke-width="1" />
    <text x="95" y="22" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#C7A477">NFPA 2112 CERTIFIED</text>
  </g>
</svg>
