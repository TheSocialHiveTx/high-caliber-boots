<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none" role="img" aria-label="Western Boots Collection">
  <defs>
    <radialGradient id="westBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#241913" />
      <stop offset="60%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0a0908" />
    </radialGradient>
  </defs>

  <rect width="600" height="700" fill="url(#westBg)" />

  <!-- Pair of Western Boots in saddle tan & oil tanned leather -->
  <g transform="translate(110, 130)">
    <!-- Shadow -->
    <ellipse cx="200" cy="465" rx="210" ry="26" fill="#000000" opacity="0.85" />

    <!-- Back Boot (Right) -->
    <g transform="translate(50, -10) scale(0.96)" opacity="0.8">
      <path d="M110,40 C140,20 230,20 260,40 L275,310 L100,320 Z" fill="#2d1c13" stroke="#806247" stroke-width="1.5" />
      <path d="M100,320 L275,310 C320,335 380,365 415,405 L405,425 L70,425 L65,370 Z" fill="#3a2519" />
      <path d="M70,425 L60,475 L120,475 L130,425 Z" fill="#14100d" />
      <path d="M65,425 L415,423 L415,435 L65,437 Z" fill="#2d1c13" stroke="#806247" />
    </g>

    <!-- Front Boot (Left) -->
    <g>
      <path d="M90,30 C120,10 210,10 240,30 L255,300 L80,310 Z" fill="#442a1d" stroke="#C7A477" stroke-width="1.5" />
      <!-- Western scallop collar -->
      <path d="M90,30 Q165,55 240,30" stroke="#C7A477" stroke-width="2.5" fill="none" />
      <!-- Multi-color 6-row stitching -->
      <path d="M110,60 Q165,160 115,260" stroke="#C7A477" stroke-width="1.5" fill="none" />
      <path d="M125,70 Q165,160 130,250" stroke="#806247" stroke-width="1.2" fill="none" />
      <path d="M220,60 Q165,160 215,260" stroke="#C7A477" stroke-width="1.5" fill="none" />
      <path d="M205,70 Q165,160 200,250" stroke="#806247" stroke-width="1.2" fill="none" />

      <!-- Vamp (Saddle Tan Oil-Tanned Calfskin with corded toe medallion) -->
      <path d="M80,310 L255,300 C300,325 360,355 400,395 C410,405 405,416 390,418 L55,418 L50,360 Z" fill="#543524" stroke="#806247" stroke-width="1.5" />
      
      <!-- Toe Bug / Western Medallion on Vamp -->
      <g transform="translate(300, 365)" stroke="#C7A477" stroke-width="1.2" fill="none">
        <path d="M-20,-10 C0,-25 30,-10 40,5 C30,20 0,5 -20,-10 Z" />
        <path d="M-10,-5 Q10,-10 30,0" />
        <circle cx="10" cy="-3" r="1.5" fill="#C7A477" />
      </g>

      <!-- Heel -->
      <path d="M55,418 L45,470 L105,470 L115,418 Z" fill="#1b120c" stroke="#806247" stroke-width="1" />
      <rect x="45" y="460" width="60" height="10" fill="#090909" />

      <!-- Leather Welt Sole with Lemonwood Peg detail -->
      <path d="M50,418 L395,416 L395,430 L50,432 Z" fill="#2d1c13" stroke="#C7A477" stroke-width="1.2" />
      <line x1="115" y1="422" x2="390" y2="420" stroke="#F1EDE6" stroke-width="1.4" stroke-dasharray="2 3" />
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(40, 610)">
    <rect width="180" height="34" rx="2" fill="#181716" stroke="#806247" stroke-width="1" />
    <text x="90" y="22" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#C7A477">CLASSIC WESTERN</text>
  </g>
</svg>
