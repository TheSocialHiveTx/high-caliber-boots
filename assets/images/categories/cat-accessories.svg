<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none" role="img" aria-label="Western Accessories and Leather Belts">
  <defs>
    <radialGradient id="accBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#221a14" />
      <stop offset="60%" stop-color="#14110f" />
      <stop offset="100%" stop-color="#0a0908" />
    </radialGradient>
    <linearGradient id="silverBuckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1EDE6" />
      <stop offset="50%" stop-color="#C7A477" />
      <stop offset="100%" stop-color="#806247" />
    </linearGradient>
  </defs>

  <rect width="600" height="700" fill="url(#accBg)" />

  <!-- Coiled Hand-Tooled Floral Western Leather Belt with Engraved Buckle -->
  <g transform="translate(100, 120)">
    <!-- Shadow -->
    <ellipse cx="200" cy="460" rx="190" ry="24" fill="#000000" opacity="0.85" />

    <!-- Coiled Belt Leather Strap Loops -->
    <!-- Outer coil -->
    <ellipse cx="200" cy="330" rx="180" ry="110" fill="#2d1c13" stroke="#806247" stroke-width="2" />
    <ellipse cx="200" cy="330" rx="145" ry="85" fill="#14110f" stroke="#806247" stroke-width="1.5" />
    
    <!-- Inner coil -->
    <ellipse cx="200" cy="310" rx="125" ry="75" fill="#3a2418" stroke="#806247" stroke-width="2" />
    <ellipse cx="200" cy="310" rx="90" ry="50" fill="#181513" stroke="#806247" stroke-width="1.5" />

    <!-- Hand-tooled Floral Sheridan Carving detail on leather -->
    <g stroke="#C7A477" stroke-width="1.2" fill="none" opacity="0.75">
      <path d="M120,380 Q160,420 200,380 Q240,420 280,380" />
      <circle cx="160" cy="395" r="4" fill="#806247" />
      <circle cx="240" cy="395" r="4" fill="#806247" />
      <path d="M100,280 Q130,250 160,280" />
      <path d="M240,280 Q270,250 300,280" />
    </g>

    <!-- Large Trophy / 3-Piece Western Engraved Belt Buckle (Foreground center) -->
    <g transform="translate(130, 160)">
      <!-- Buckle Base Plate -->
      <rect x="0" y="0" width="140" height="100" rx="18" fill="#141414" stroke="url(#silverBuckle)" stroke-width="3" />
      <rect x="8" y="8" width="124" height="84" rx="12" fill="#1e1814" stroke="#806247" stroke-width="1.5" />
      
      <!-- Engraved filigree in buckle corners -->
      <path d="M16,16 Q40,16 40,40" stroke="#C7A477" stroke-width="1.5" fill="none" />
      <path d="M124,16 Q100,16 100,40" stroke="#C7A477" stroke-width="1.5" fill="none" />
      <path d="M16,84 Q40,84 40,60" stroke="#C7A477" stroke-width="1.5" fill="none" />
      <path d="M124,84 Q100,84 100,60" stroke="#C7A477" stroke-width="1.5" fill="none" />

      <!-- Center Gold/Bronze Longhorn or Monogram -->
      <g transform="translate(70, 50)">
        <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#C7A477" />
        <circle cx="0" cy="0" r="3" fill="#181716" />
      </g>
      <!-- Rope twist border around perimeter -->
      <rect x="4" y="4" width="132" height="92" rx="15" fill="none" stroke="#C7A477" stroke-width="1" stroke-dasharray="3 3" />
    </g>
  </g>

  <!-- Tag -->
  <g transform="translate(40, 610)">
    <rect width="190" height="34" rx="2" fill="#181716" stroke="#806247" stroke-width="1" />
    <text x="95" y="22" text-anchor="middle" font-family="'Cinzel', serif" font-size="12" font-weight="700" letter-spacing="2" fill="#C7A477">HAND-TOOLED GEAR</text>
  </g>
</svg>
