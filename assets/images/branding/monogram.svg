<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none" role="img" aria-label="High Caliber Monogram">
  <defs>
    <linearGradient id="monoBronze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1EDE6" />
      <stop offset="40%" stop-color="#C7A477" />
      <stop offset="75%" stop-color="#806247" />
      <stop offset="100%" stop-color="#9A542E" />
    </linearGradient>
    <radialGradient id="monoDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="80%" stop-color="#111111" />
      <stop offset="100%" stop-color="#090909" />
    </radialGradient>
  </defs>

  <!-- Circular / Octagonal Western Frame -->
  <polygon points="60,6 98,22 114,60 98,98 60,114 22,98 6,60 22,22" fill="url(#monoDark)" stroke="url(#monoBronze)" stroke-width="2.5" />
  <polygon points="60,14 92,27 106,60 92,93 60,106 28,93 14,60 28,27" fill="none" stroke="rgba(199, 164, 119, 0.35)" stroke-width="1" />

  <!-- Western decorative corner notches -->
  <circle cx="60" cy="14" r="2.5" fill="#C7A477" />
  <circle cx="106" cy="60" r="2.5" fill="#C7A477" />
  <circle cx="60" cy="106" r="2.5" fill="#C7A477" />
  <circle cx="14" cy="60" r="2.5" fill="#C7A477" />

  <!-- Bold Monogram Letters H & C -->
  <path d="M38 36 L48 36 L48 53 L72 53 L72 36 L82 36 L82 84 L72 84 L72 63 L48 63 L48 84 L38 84 Z" fill="url(#monoBronze)" />
  <path d="M72 42 C58 42 46 50 46 60 C46 70 58 78 72 78 L74 71 C63 71 55 66 55 60 C55 54 63 49 74 49 Z" fill="#F1EDE6" opacity="0.95" />
  
  <!-- Center Star Motif -->
  <polygon points="60,54 62,58 66,60 62,62 60,66 58,62 54,60 58,58" fill="#C7A477" />
</svg>
