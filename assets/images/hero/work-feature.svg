<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%" fill="none" role="img" aria-label="Built For The Job - Work Boots">
  <defs>
    <radialGradient id="workSplitBg" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#24211d" />
      <stop offset="60%" stop-color="#141311" />
      <stop offset="100%" stop-color="#0a0a09" />
    </radialGradient>
  </defs>

  <rect width="700" height="500" fill="url(#workSplitBg)" />

  <!-- Industrial backdrop details -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="380" x2="700" y2="380" stroke-width="2" />
    <line x1="0" y1="440" x2="700" y2="440" stroke-width="2" />
    <path d="M100,50 L120,70 M250,80 L270,100 M450,40 L470,60" />
  </g>

  <!-- Heavy Work Boot on Steel Floor -->
  <g transform="translate(180, 80)">
    <ellipse cx="200" cy="340" rx="200" ry="22" fill="#000000" opacity="0.9" />

    <!-- Upper -->
    <path d="M120,40 C140,30 200,30 220,40 L230,190 L105,200 Z" fill="#2d251f" stroke="#50453b" stroke-width="1.5" />
    <path d="M110,35 Q170,25 230,35 L230,55 Q170,45 110,55 Z" fill="#111111" />

    <!-- Lacing -->
    <g fill="#C7A477">
      <circle cx="160" cy="80" r="3" /><circle cx="185" cy="75" r="3" />
      <circle cx="162" cy="110" r="3" /><circle cx="187" cy="105" r="3" />
      <circle cx="164" cy="140" r="3" /><circle cx="189" cy="135" r="3" />
      <circle cx="166" cy="170" r="3" /><circle cx="191" cy="165" r="3" />
      <line x1="160" y1="80" x2="187" y2="105" stroke="#C7A477" stroke-width="2" />
      <line x1="185" y1="75" x2="162" y2="110" stroke="#C7A477" stroke-width="2" />
      <line x1="162" y1="110" x2="189" y2="135" stroke="#C7A477" stroke-width="2" />
      <line x1="187" y1="105" x2="164" y2="140" stroke="#C7A477" stroke-width="2" />
      <line x1="164" y1="140" x2="191" y2="165" stroke="#C7A477" stroke-width="2" />
    </g>

    <!-- Vamp & Safety Cap -->
    <path d="M105,200 L230,190 C270,210 320,240 350,275 C360,290 355,305 340,310 L75,310 L70,250 Z" fill="#382d24" stroke="#806247" stroke-width="1.5" />
    <path d="M280,250 C320,265 350,280 345,305 L250,305 Z" fill="#241e19" stroke="#A54B25" stroke-width="1.2" />

    <!-- Outsole -->
    <path d="M65,310 L350,310 L345,340 L60,340 Z" fill="#141414" stroke="#444444" stroke-width="1.5" />
    <line x1="75" y1="315" x2="340" y2="315" stroke="#C7A477" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>
</svg>
