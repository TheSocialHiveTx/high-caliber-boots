<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" fill="none" role="img" aria-label="Exotic Leather Boots Feature">
  <defs>
    <radialGradient id="exGrad" cx="60%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2c1e16" />
      <stop offset="50%" stop-color="#181310" />
      <stop offset="100%" stop-color="#0a0807" />
    </radialGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#exGrad)" />

  <!-- Macro texture overlay of Caiman / Alligator Tiles across the section -->
  <g opacity="0.2">
    <g transform="translate(100, 40)">
      <rect x="0" y="0" width="120" height="90" rx="8" fill="#3a271c" stroke="#1d1510" stroke-width="2" />
      <rect x="130" y="0" width="150" height="90" rx="8" fill="#332218" stroke="#1d1510" stroke-width="2" />
      <rect x="290" y="0" width="150" height="90" rx="8" fill="#3a271c" stroke="#1d1510" stroke-width="2" />
      <rect x="450" y="0" width="120" height="90" rx="8" fill="#302016" stroke="#1d1510" stroke-width="2" />
      <rect x="580" y="0" width="140" height="90" rx="8" fill="#38251a" stroke="#1d1510" stroke-width="2" />

      <rect x="20" y="105" width="140" height="110" rx="10" fill="#332218" stroke="#1d1510" stroke-width="2" />
      <rect x="170" y="105" width="180" height="110" rx="10" fill="#3e2a1e" stroke="#1d1510" stroke-width="2" />
      <rect x="360" y="105" width="180" height="110" rx="10" fill="#36241a" stroke="#1d1510" stroke-width="2" />
      <rect x="550" y="105" width="140" height="110" rx="10" fill="#322117" stroke="#1d1510" stroke-width="2" />
    </g>
  </g>

  <!-- Dramatic Exotic Boot Trio / Macro angle -->
  <g transform="translate(520, 100)">
    <ellipse cx="220" cy="420" rx="240" ry="30" fill="#000000" opacity="0.9" />

    <!-- Boot Shaft -->
    <path d="M120,40 C140,20 260,20 280,40 L295,290 L105,300 Z" fill="#1c1612" stroke="#806247" stroke-width="1.8" />
    <!-- Western stitch flourish -->
    <path d="M140,70 Q200,160 145,260" stroke="#806247" stroke-width="1.5" fill="none" stroke-dasharray="4 2" />
    <path d="M260,70 Q200,160 255,260" stroke="#806247" stroke-width="1.5" fill="none" stroke-dasharray="4 2" />
    <path d="M200,80 Q200,170 200,260" stroke="#C7A477" stroke-width="1.5" fill="none" />

    <!-- Caiman Vamp -->
    <path d="M105,300 L295,290 C340,315 410,345 440,385 C445,395 440,405 420,408 L70,408 L65,350 Z" fill="#2d1d14" stroke="#806247" stroke-width="1.5" />
    <!-- Deep tile grooves -->
    <line x1="160" y1="305" x2="160" y2="405" stroke="#3d2a1c" stroke-width="2.5" />
    <line x1="220" y1="310" x2="225" y2="405" stroke="#3d2a1c" stroke-width="2.5" />
    <line x1="280" y1="320" x2="295" y2="405" stroke="#3d2a1c" stroke-width="2.5" />
    <line x1="340" y1="340" x2="365" y2="405" stroke="#3d2a1c" stroke-width="2.5" />
    <line x1="390" y1="365" x2="415" y2="405" stroke="#3d2a1c" stroke-width="2.5" />

    <!-- Stacked Leather Heel -->
    <path d="M70,408 L60,455 L120,455 L130,408 Z" fill="#14100d" stroke="#806247" stroke-width="1" />
    <rect x="60" y="445" width="60" height="10" fill="#080808" />

    <!-- Welt & Leather Sole with Brass Nails -->
    <path d="M65,408 L430,406 L430,420 L65,422 Z" fill="#3a2517" stroke="#C7A477" stroke-width="1.2" />
    <line x1="130" y1="412" x2="425" y2="410" stroke="#F1EDE6" stroke-width="1.4" stroke-dasharray="2 3" />
  </g>
</svg>
